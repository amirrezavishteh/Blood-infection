# /etc/nginx/sites-available/sepsis  -> symlink into sites-enabled, then: nginx -t && systemctl reload nginx
# TLS certificates: certbot --nginx -d sepsis.example.org  (replace the server_name below)
server {
    listen 80;
    server_name sepsis.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sepsis.example.org;

    ssl_certificate     /etc/letsencrypt/live/sepsis.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sepsis.example.org/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 4m;   # PSV uploads are capped at 2 MB by the API

    # Optional second layer in front of the bearer token:
    # auth_basic "Sepsis research simulator";
    # auth_basic_user_file /etc/nginx/sepsis.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
