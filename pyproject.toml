[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsis-research"
version = "0.1.0"
description = "Retrospective sepsis early-warning research simulator (PhysioNet/CinC 2019). Not for clinical use."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "duckdb>=1.0",
  "pyyaml>=6",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src", "apps"]
include = ["sepsis*", "api*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "apps"]
addopts = "-q"
markers = [
  "full_data: requires the downloaded PhysioNet 2019 corpus (skipped otherwise)",
]
