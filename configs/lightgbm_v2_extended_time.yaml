# Round 2: v2 causal features (24 h vital windows, change from first value, partial SOFA,
# S/F ratio, missing-aware screening counts); ablation adding time in ICU / hospital (ICULOS, HospAdmTime).
# Random search on a_validation (AUPRC), early stopping on a_validation, 3-seed bag of the winner.
dataset: physionet2019
target_id: challenge2019_state
seed: 2019
features: {feature_set: extended, windows: [3, 6, 12, 24], vital_expiry_h: 6, lab_expiry_h: 48,
           baseline_deltas: true, organ_scores: true, include_time: true}
model:
  kind: lightgbm
  n_seeds: 3
  params: {max_rounds: 4000, early_stopping: 150}
  search:
    n_trials: 12
    seed: 7
    space:
      learning_rate: [0.02, 0.03, 0.05]
      num_leaves: [15, 31, 63, 127]
      min_child_samples: [100, 200, 400, 800, 1600]
      feature_fraction: [0.3, 0.5, 0.7]
      bagging_fraction: [0.6, 0.8, 1.0]
      lambda_l2: [0.0, 1.0, 10.0, 50.0]
      class_weight: [null, balanced]
